name: macOS C++ Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S cpp-sfml -B cpp-sfml/build

      - name: Build
        run: cmake --build cpp-sfml/build
